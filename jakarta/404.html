<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Menyimpan path yang diakses saat 404 lalu mengarahkan kembali ke index.html
    var pathSegmentsToKeep = 1; // 1 jika repository GitHub Pages (user.github.io/repo-name)
    var l = window.location;
    
    sessionStorage.setItem('redirect_path', 
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') + l.search + l.hash
    );
    
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, pathSegmentsToKeep + 1).join('/') + '/index.html'
    );
  </script>
</head>
<body>
</body>
</html>
