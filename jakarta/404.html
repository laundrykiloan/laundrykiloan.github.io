<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    (function() {
      // Dibuat 1 agar mendukung repository subfolder (username.github.io/nama-repo)
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var redirectPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') + l.search + l.hash;
      sessionStorage.setItem('redirect_path', redirectPath);
      var rootPath = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/' + l.pathname.split('/').slice(1, 1 + pathSegmentsToKeep).join('/');
      l.replace(rootPath);
    })();
  </script>
</head>
<body>
</body>
</html>
